# تشغيل ZK system على سيرفر مع HTTPS تلقائي (Caddy يجيب شهادة مجانية من Let's Encrypt)
# 1) انسخ .env.example إلى .env وعبّي الدومين وكلمة مرور المدير
# 2) docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ERP_DATA_DIR: /data
      ERP_BEHIND_PROXY: "1"
      ERP_HTTPS: "1"
      PORT: "8000"
    volumes:
      - zk_data:/data
    # المنفذ 8000 داخلي فقط: لا يُفتح للإنترنت إلا عبر Caddy (HTTPS)
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    command: caddy reverse-proxy --from ${DOMAIN} --to app:8000
    volumes:
      - caddy_data:/data
    depends_on:
      - app

volumes:
  zk_data:
  caddy_data:
